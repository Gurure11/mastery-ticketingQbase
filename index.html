<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBase Login</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', sans-serif; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f172a; padding:20px; }
    .login-card { width:100%; max-width:430px; background:white; border-radius:28px; padding:30px; box-shadow:0 24px 80px rgba(0,0,0,.35); }
    h1 { margin:0; color:#0f172a; font-size:28px; }
    p { color:#64748b; margin:8px 0 24px; }
    label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; color:#334155; margin-bottom:6px; }
    input { width:100%; padding:13px 14px; border:1px solid #cbd5e1; border-radius:14px; margin-bottom:16px; font-size:15px; }
    button { width:100%; padding:13px 16px; border:none; border-radius:999px; background:#3b82f6; color:white; font-weight:800; cursor:pointer; font-size:15px; }
    button:hover { background:#2563eb; }
    .msg { display:none; margin-top:14px; padding:12px; border-radius:14px; font-size:14px; }
    .error { background:#fee2e2; color:#991b1b; }
    .success { background:#dcfce7; color:#166534; }
    .small { font-size:12px; color:#94a3b8; text-align:center; margin-top:18px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>QuickBase Login</h1>
    <p>Sign in with your email and password to access your dashboard rights.</p>

    <label>Email</label>
    <input id="email" type="email" placeholder="name@company.com">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>
    <div id="msg" class="msg"></div>
    <div class="small">Executive Managers will see approvals. Other users will not.</div>
  </div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVn0LFIjW2UnSbnZKsedsUPobhd9IqIZNj459DR8DpkZiY2rK-SUJp6BIcBv92YWEaew/exec';
  const DASHBOARD_URL = 'details.html';

  function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg ' + type;
    msg.style.display = 'block';
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) return showMsg('Email and password required.', 'error');

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', payload: { email, password } })
      });
      const data = await res.json();
      if (!data.success) return showMsg(data.message || 'Login failed.', 'error');

      localStorage.setItem('quickbase_user', JSON.stringify(data.user));
      showMsg('Login successful. Opening dashboard...', 'success');
      setTimeout(() => { window.location.href = DASHBOARD_URL; }, 600);
    } catch (e) {
      showMsg('Connection failed: ' + e.message, 'error');
    }
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
