    .status-stat-card h3 { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
    .status-stat-card p { font-size: 12px; color: #64748b; }

      background: #f1f5f9;
      border-radius: 20px;
      padding: 12px 20px;
      margin-bottom: 20px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 4px #22c55e; }
    .status-dot.offline { background: #ef4444; }
    .status-dot.checking { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    @media (max-width: 768px) {
      .sidebar { width: 80px; }
      .nav-link span:not(.emoji) { display: none; }
      .main { padding: 16px; }
      .chart-grid { grid-template-columns: 1fr; }
      .task-status-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

  // Load saved tasks from localStorage
  function loadLocalTasks() {
    const saved = localStorage.getItem('onpoint_tasks');
    if (saved) {
      try { localTaskStore = JSON.parse(saved); } catch(e) {}
    }
    return localTaskStore;
  }

  function saveLocalTasks() {
    localStorage.setItem('onpoint_tasks', JSON.stringify(localTaskStore));
  }

  function addLocalTask(task) {
    const newId = Date.now().toString();
    const newTask = { ...task, id: newId, 'Task ID': newId, createdAt: new Date().toISOString() };
    localTaskStore.unshift(newTask);
    saveLocalTasks();
    return newTask;
  }

  // API with better error handling
  async function apiGet(action) {
    try {
      const url = `${SCRIPT_URL}?action=${encodeURIComponent(action)}&_=${Date.now()}`;
      const res = await fetch(url, { method: 'GET', cache: 'no-store', mode: 'cors' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (Array.isArray(json)) return json;
      if (json && Array.isArray(json.data)) return json.data;
      if (json && Array.isArray(json.rows)) return json.rows;
      return [];
    } catch(e) {
      console.warn(`API GET ${action} failed:`, e);
      return null;
    }
  }

  async function apiPost(action, payload) {
    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, payload, sheetId: SHEET_ID, user: currentUser }),
        mode: 'cors'
      });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch(e) { json = { success: res.ok, message: text, raw: true }; }
      return json;
    } catch(e) {
      console.error(`API POST ${action} failed:`, e);
      return { success: false, error: e.message, networkError: true };
    }
  }

  async function loadEmployeesFromSheet() {
    try {
      const employees = await apiGet('employees');
      if (employees && employees.length) {
        employeesList = employees.map(emp => ({ 
          name: emp['Employee Name'] || emp['Full Name'] || emp.Name || emp['Name'],
          email: emp.Email || emp['Email Address'] || emp['Work Email'],
          phone: emp['Phone'] || emp['Mobile'] || ''
        })).filter(e => e.name && e.email);
      }
    } catch(e) {}
    if (!employeesList.length) employeesList = FALLBACK_EMPLOYEES;
    return employeesList;
  }

  function renderEmployeeSelect(selectedName = '', includeEmpty = true) {
    let html = includeEmpty ? '<option value="">Select assignee</option>' : '';
    employeesList.forEach(emp => {
      html += `<option value="${escapeHtml(emp.name)}" ${emp.name === selectedName ? 'selected' : ''}>${escapeHtml(emp.name)}</option>`;
    });
    return html;
  }

  function getEmailFromName(name) {
    const emp = employeesList.find(e => e.name === name);
    return emp ? emp.email : '';
  }

  function getPhoneFromName(name) {
    const emp = employeesList.find(e => e.name === name);
    return emp?.phone || '';
  }

  function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
  
  function showMessage(msg, type, containerId) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.textContent = msg;
    el.className = `message-bar message-${type}`;
    el.style.display = 'block';
    setTimeout(() => { if(el) el.style.display = 'none'; }, 5000);
  }

  async function saveTask(payload, buttonId, messageId, successMsg) {
    const btn = document.getElementById(buttonId);
    if(btn) { btn.disabled = true; btn.innerHTML = '⏳ Saving...'; }
    showMessage('Saving task...', 'info', messageId);
    
    try {
      // Try API first
      const res = await apiPost('addTicket', payload);
      
      if (res && (res.success === true || res.status === 'success')) {
        showMessage(successMsg + ' (Synced to Google Sheets)', 'success', messageId);
        alert(successMsg);
        return true;
      } else {
        // API failed, save locally
        console.warn('API save failed, saving locally:', res);
        addLocalTask(payload);
        showMessage('⚠️ Google Sheets sync failed. Task saved locally. Will retry later.', 'warning', messageId);
        alert('Task saved locally. Google Sheets connection issue will be retried.');
        return true;
      }
    } catch(e) {
      // Fallback to local storage
      addLocalTask(payload);
      showMessage(`⚠️ Network error: ${e.message}. Task saved locally.`, 'warning', messageId);
      alert('Task saved locally due to connection issue.');
      return true;
    } finally {
      if(btn) { btn.disabled = false; btn.innerHTML = '✨ Create Task'; }
    }
  }

  function openWhatsApp(phoneNumber, taskDetails) {
    let cleanPhone = String(phoneNumber || '').replace(/\D/g, '');
    if (!cleanPhone) {
      alert('No phone number available for this assignee.');
      return;
    }
    if (!cleanPhone.startsWith('27') && cleanPhone.length === 10) cleanPhone = '27' + cleanPhone.substring(1);
    const msg = `📋 *NEW TASK ASSIGNED*%0A%0A📌 *Task:* ${encodeURIComponent(taskDetails.title || '')}%0A📝 *Description:* ${encodeURIComponent(taskDetails.desc || '')}%0A⚡ *Priority:* ${taskDetails.priority}%0A📅 *Due Date:* ${taskDetails.dueDate || 'Not set'}%0A🏢 *Department:* ${taskDetails.department || 'Not specified'}%0A%0A🔗 Please log in to the task management system for updates.`;
    window.open(`https://wa.me/${cleanPhone}?text=${msg}`, '_blank');
  }

  // ==================== DASHBOARD ====================
  async function renderDashboard() {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="loading" style="text-align:center;padding:60px">Loading dashboard...</div>';
    
    let tickets = await apiGet('tickets');
    let allTasks = [];
    if (tickets && tickets.length) {
      allTasks = tickets;
    } else {
      allTasks = loadLocalTasks();
    }
    
    const ticketsArr = Array.isArray(allTasks) ? allTasks : [];
    const today = new Date(); today.setHours(0,0,0,0);
    let openTasks = 0, openOverdue = 0, closedLate = 0;
    ticketsArr.forEach(t => {
      const status = String(t.Status || t.status || '').toLowerCase();
      const due = t['Due Date'] || t.dueDate ? new Date(t['Due Date'] || t.dueDate) : null;
      const isLate = due && due < today;
      if (status !== 'closed' && status !== 'resolved' && status !== 'done') {
        openTasks++;
        if (isLate) openOverdue++;
      } else if (isLate) closedLate++;
    });
    
    const priorityCounts = { Critical:0, High:0, Medium:0, Low:0 };
    ticketsArr.forEach(t => { 
      const p = String(t.Priority || t.priority || 'Medium'); 
      if(p.includes('Critical')) priorityCounts.Critical++; 
      else if(p.includes('High')) priorityCounts.High++; 
      else if(p.includes('Low')) priorityCounts.Low++; 
      else priorityCounts.Medium++; 
    });
    
    const deptCount = {};
    ticketsArr.forEach(t => { const d = t.Department || t.department || 'Unassigned'; deptCount[d] = (deptCount[d]||0)+1; });

    main.innerHTML = `
      <div class="connection-status">
        <span><span class="status-dot ${tickets && tickets.length ? 'online' : 'offline'}"></span> ${tickets && tickets.length ? '🟢 Connected to Google Sheets' : '🔴 Offline Mode - Local Storage Active'}</span>
        <button class="btn-secondary" onclick="testConnection()" style="padding:4px 12px">Test Connection</button>
      </div>
      <div class="top-bar"><div class="page-title"><h1>Operations Dashboard</h1><p>On Point Group · Real-time task management</p></div><button class="refresh-btn" onclick="loadCurrentSection()">↻ Refresh</button></div>
      <div class="task-status-grid">
        <div class="status-stat-card" onclick="currentSection='tickets';window.taskFilter='open';loadCurrentSection()"><h3 style="color:#3b82f6">${openTasks}</h3><p>📋 Open Tasks</p></div>
        <div class="status-stat-card" onclick="currentSection='tickets';window.taskFilter='overdue';loadCurrentSection()"><h3 style="color:#ef4444">${openOverdue}</h3><p>⚠️ Open Overdue</p></div>
        <div class="status-stat-card" onclick="currentSection='tickets';window.taskFilter='closed-late';loadCurrentSection()"><h3 style="color:#f59e0b">${closedLate}</h3><p>✅ Closed Late</p></div>
        <div class="status-stat-card" onclick="currentSection='tickets';loadCurrentSection()"><h3 style="color:#8b5cf6">${ticketsArr.length}</h3><p>🎫 Total Tasks</p></div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">🎫 Total Tasks</div><div class="kpi-value">${ticketsArr.length}</div></div>
        <div class="kpi-card"><div class="kpi-label">📋 Open Tasks</div><div class="kpi-value">${openTasks}</div></div>
        <div class="kpi-card"><div class="kpi-label">⚠️ Overdue</div><div class="kpi-value">${openOverdue}</div></div>
        <div class="kpi-card"><div class="kpi-label">🔥 Critical</div><div class="kpi-value">${priorityCounts.Critical}</div></div>
      </div>
      <div class="chart-grid"><div class="chart-card"><h3>Tasks by Priority</h3><canvas id="priorityChart"></canvas></div><div class="chart-card"><h3>Tasks by Department</h3><canvas id="deptChart"></canvas></div></div>
      <div class="panel"><div class="panel-header"><h2>➕ Create New Task / Ticket</h2></div><div style="padding:20px" id="taskFormContainer"></div></div>
      <div class="panel"><div class="panel-header"><h2>📋 Recent Tasks</h2><button class="btn-secondary" onclick="currentSection='tickets';loadCurrentSection()">View All →</button></div><div class="table-wrapper" id="recentTasksTable"></div></div>
    `;
    
    if (typeof Chart !== 'undefined') {
      const pCtx = document.getElementById('priorityChart')?.getContext('2d');
      if(pCtx) { if(charts.priority) charts.priority.destroy(); charts.priority = new Chart(pCtx, { type:'doughnut', data:{ labels:['Critical','High','Medium','Low'], datasets:[{ data:[priorityCounts.Critical, priorityCounts.High, priorityCounts.Medium, priorityCounts.Low], backgroundColor:['#ef4444','#f97316','#3b82f6','#22c55e'] }] } }); }
      const dCtx = document.getElementById('deptChart')?.getContext('2d');
      if(dCtx && Object.keys(deptCount).length) { if(charts.dept) charts.dept.destroy(); charts.dept = new Chart(dCtx, { type:'bar', data:{ labels:Object.keys(deptCount), datasets:[{ label:'Tasks', data:Object.values(deptCount), backgroundColor:'#3b82f6' }] } }); }
    }
    
    document.getElementById('taskFormContainer').innerHTML = `
      <div class="form-row"><div class="form-field"><label>Task Title *</label><input id="taskTitle" placeholder="e.g., Weekly Report"></div>
      <div class="form-field"><label>Priority</label><select id="taskPriority"><option>Medium</option><option>Low</option><option>High</option><option>Critical</option></select></div>
      <div class="form-field"><label>Status</label><select id="taskStatus"><option>Open</option><option>In Progress</option><option>Pending</option><option>Closed</option></select></div></div>
      <div class="form-row"><div class="form-field"><label>Department</label><input id="taskDept" placeholder="Department"></div>
      <div class="form-field"><label>Assigned To *</label><select id="taskAssignee">${renderEmployeeSelect()}</select></div>
      <div class="form-field"><label>Assignee Email</label><input id="taskAssigneeEmail" readonly placeholder="Auto-filled"></div>
      <div class="form-field"><label>Due Date</label><input type="date" id="taskDueDate"></div></div>
      <div class="form-row"><div class="form-field"><label>Description</label><textarea id="taskDesc" rows="2" placeholder="Detailed description"></textarea></div></div>
      <div style="display:flex; gap:12px; flex-wrap:wrap"><button class="btn-primary" id="createTaskBtn">✨ Create Task</button><div id="taskFormMessage" class="message-bar"></div></div>
    `;
    
    document.getElementById('taskAssignee')?.addEventListener('change', () => {
      const email = getEmailFromName(document.getElementById('taskAssignee').value);
      document.getElementById('taskAssigneeEmail').value = email;
    });
    
    document.getElementById('createTaskBtn')?.addEventListener('click', async () => {
      const title = document.getElementById('taskTitle').value.trim();
      if (!title) return showMessage('Task Title required', 'error', 'taskFormMessage');
      const assignedTo = document.getElementById('taskAssignee').value;
      if (!assignedTo) return showMessage('Please select an assignee', 'error', 'taskFormMessage');
      const payload = {
        title, priority: document.getElementById('taskPriority').value, status: document.getElementById('taskStatus').value,
        department: document.getElementById('taskDept').value, assignedTo, assignedEmail: getEmailFromName(assignedTo),
        dueDate: document.getElementById('taskDueDate').value, description: document.getElementById('taskDesc').value,
        sheetId: SHEET_ID, sheetTab: 'Tickets', comments: '', completionDate: ''
      };
      await saveTask(payload, 'createTaskBtn', 'taskFormMessage', 'Task created successfully!');
      setTimeout(() => loadCurrentSection(), 1000);
    });
    
    const recent = ticketsArr.slice(0,8);
    document.getElementById('recentTasksTable').innerHTML = `<table><thead><tr><th>ID</th><th>Title</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>Due Date</th><th>Action</th></tr></thead><tbody>${recent.map(t => `<tr>
      <td>${escapeHtml(t['Task ID'] || t.id || '-')}</td>
      <td>${escapeHtml(t.Title || t.title)}</td>
      <td><span class="badge badge-${(t.Priority || t.priority || 'Medium').toLowerCase()}">${t.Priority || t.priority || 'Medium'}</span></td>
      <td>${escapeHtml(t.Status || t.status || 'Open')}</td>
      <td>${escapeHtml(t['Assigned To'] || t.assignedTo)}</td>
      <td>${escapeHtml(t['Due Date'] || t.dueDate || '-')}</td>
      <td><button class="btn-whatsapp" onclick="forwardTaskToWhatsApp('${escapeHtml(t['Assigned To'] || t.assignedTo || '')}', '${escapeHtml(t.Title || t.title || '')}', '${escapeHtml(t.Description || t.description || '')}', '${t.Priority || t.priority || 'Medium'}', '${t['Due Date'] || t.dueDate || ''}')">📱 WhatsApp</button></td>
    </tr>`).join('') || '<tr><td colspan="7">No tasks found</td></tr>'}</tbody>`;
  }

  window.forwardTaskToWhatsApp = (assigneeName, title, desc, priority, dueDate) => {
    const phone = getPhoneFromName(assigneeName);
    const email = getEmailFromName(assigneeName);
    const details = { title, desc, priority, dueDate, department: '' };
    if (phone) {
      if (confirm(`Send WhatsApp to ${assigneeName}?`)) openWhatsApp(phone, details);
    } else {
      alert(`No phone number for ${assigneeName}. Email: ${email || 'Not found'}`);
    }
  };

  window.testConnection = async () => {
    const result = await apiGet('tickets');
    if (result && result.length) {
      alert(`✅ Connected! Retrieved ${result.length} records from Google Sheets.`);
    } else {
      alert(`⚠️ Connection issue. Using local storage mode. Check Apps Script deployment.`);
    }
    loadCurrentSection();
  };

  async function renderTicketsPage() {
    let tickets = await apiGet('tickets');
    if (!tickets || !tickets.length) tickets = loadLocalTasks();
    
    if (window.taskFilter === 'open') tickets = tickets.filter(t => !String(t.Status || t.status || '').toLowerCase().includes('closed'));
    else if (window.taskFilter === 'overdue') { 
      const today = new Date(); 
      tickets = tickets.filter(t => { 
        const due = new Date(t['Due Date'] || t.dueDate); 
        return due < today && !String(t.Status || t.status || '').toLowerCase().includes('closed'); 
      }); 
    }
    else if (window.taskFilter === 'closed-late') { 
      const today = new Date(); 
      tickets = tickets.filter(t => { 
        const due = new Date(t['Due Date'] || t.dueDate); 
        return due < today && String(t.Status || t.status || '').toLowerCase().includes('closed'); 
      }); 
    }
    
    const main = document.getElementById('mainContent');
    main.innerHTML = `
      <div class="connection-status"><span><span class="status-dot"></span> Data Mode</span></div>
      <div class="top-bar"><div class="page-title"><h1>Tasks & Tickets</h1><p>Full task register</p></div><button class="refresh-btn" onclick="loadCurrentSection()">↻ Refresh</button></div>
      <div class="panel"><div class="panel-header"><h2>➕ New Task</h2></div><div style="padding:20px" id="ticketFormFull"></div></div>
      <div class="panel"><div class="panel-header"><h2>📋 All Tasks</h2></div><div class="table-wrapper"><table id="fullTicketsTable"><thead><tr><th>Task ID</th><th>Title</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>Department</th><th>Due Date</th><th>WhatsApp</th></tr></thead><tbody>${tickets.map(t => `<tr>
        <td>${escapeHtml(t['Task ID'] || t.id || '-')}</td>
        <td>${escapeHtml(t.Title || t.title)}</td></td>
        <td><span class="badge badge-${(t.Priority || t.priority || 'Medium').toLowerCase()}">${t.Priority || t.priority || 'Medium'}</span></td></td>
        <td>${escapeHtml(t.Status || t.status || 'Open')}</td></td>
        <td>${escapeHtml(t['Assigned To'] || t.assignedTo)}</td></td>
        <td>${escapeHtml(t.Department || t.department || '-')}</td></td>
        <td>${escapeHtml(t['Due Date'] || t.dueDate || '-')}</td></td>
        <td><button class="btn-whatsapp" onclick="forwardTaskToWhatsApp('${escapeHtml(t['Assigned To'] || t.assignedTo || '')}', '${escapeHtml(t.Title || t.title || '')}', '${escapeHtml(t.Description || t.description || '')}', '${t.Priority || t.priority || 'Medium'}', '${t['Due Date'] || t.dueDate || ''}')">📱 WhatsApp</button></td>
      </tr>`).join('') || '<tr><td colspan="8">No tasks found</td></tr>'}</tbody></table></div></div>
    `;
    
    document.getElementById('ticketFormFull').innerHTML = `
      <div class="form-row"><div class="form-field"><label>Task Title *</label><input id="taskTitle2"></div>
      <div class="form-field"><label>Priority</label><select id="taskPriority2"><option>Medium</option><option>Low</option><option>High</option><option>Critical</option></select></div>
      <div class="form-field"><label>Status</label><select id="taskStatus2"><option>Open</option><option>In Progress</option><option>Pending</option><option>Closed</option></select></div></div>
      <div class="form-row"><div class="form-field"><label>Department</label><input id="taskDept2"></div>
      <div class="form-field"><label>Assigned To</label><select id="taskAssignee2">${renderEmployeeSelect()}</select></div>
      <div class="form-field"><label>Assignee Email</label><input id="taskAssigneeEmail2" readonly></div>
      <div class="form-field"><label>Due Date</label><input type="date" id="taskDueDate2"></div></div>
      <div class="form-row"><div class="form-field"><label>Description</label><textarea id="taskDesc2" rows="2"></textarea></div></div>
      <div><button class="btn-primary" id="createTaskBtn2">✨ Save Task</button><div id="taskFormMessage2" class="message-bar"></div></div>
    `;
    
    document.getElementById('taskAssignee2')?.addEventListener('change', () => {
      document.getElementById('taskAssigneeEmail2').value = getEmailFromName(document.getElementById('taskAssignee2').value);
    });
    
    document.getElementById('createTaskBtn2')?.addEventListener('click', async () => {
      const title = document.getElementById('taskTitle2').value.trim();
      if (!title) return showMessage('Title required', 'error', 'taskFormMessage2');
      const assignedTo = document.getElementById('taskAssignee2').value;
      if (!assignedTo) return showMessage('Select assignee', 'error', 'taskFormMessage2');
      const payload = {
        title, priority: document.getElementById('taskPriority2').value, status: document.getElementById('taskStatus2').value,
        department: document.getElementById('taskDept2').value, assignedTo, assignedEmail: getEmailFromName(assignedTo),
        dueDate: document.getElementById('taskDueDate2').value, description: document.getElementById('taskDesc2').value,
        sheetId: SHEET_ID, sheetTab: 'Tickets', comments: '', completionDate: ''
      };
      await saveTask(payload, 'createTaskBtn2', 'taskFormMessage2', 'Task saved!');
      setTimeout(() => renderTicketsPage(), 1000);
    });
  }

  async function renderEmployeesPage() {
    await loadEmployeesFromSheet();
    const main = document.getElementById('mainContent');
    main.innerHTML = `<div class="top-bar"><div class="page-title"><h1>Employees Directory</h1><p>Synced from Employees Sheet Tab</p></div><button class="refresh-btn" onclick="renderEmployeesPage()">↻ Refresh</button></div>
      <div class="panel"><div class="panel-header"><h2>👥 Employee List (${employeesList.length})</h2></div><div class="table-wrapper"><table><thead><tr><th>Employee Name</th><th>Email Address</th><th>WhatsApp Number</th></tr></thead><tbody>${employeesList.map(e => `<tr><td>${escapeHtml(e.name)}</td><td>${escapeHtml(e.email)}</td><td>${escapeHtml(e.phone || 'Not set')}</td></tr>`).join('')}</tbody></table></div></div>`;
  }

  async function renderDepartments() { const data = await apiGet('departments'); renderSimpleTable('Departments', data, ['Department ID', 'Department Name', 'Manager']); }
  async function renderKPIs() { const data = await apiGet('kpis'); renderSimpleTable('KPIs', data, ['KPIName', 'Target Value', 'Actual Value', 'Related Department']); }
  async function renderBSC() { const data = await apiGet('bscMetrics'); renderSimpleTable('BSC Metrics', data, ['BSC Name', 'Target Score', 'Actual Score', 'Related Department']); }

  function renderSimpleTable(title, data, columns) {
    const main = document.getElementById('mainContent');
    const dataArr = Array.isArray(data) ? data : [];
    main.innerHTML = `<div class="top-bar"><div class="page-title"><h1>${title}</h1></div><button class="refresh-btn" onclick="loadCurrentSection()">↻ Refresh</button></div>
      <div class="panel"><div class="table-wrapper"><table><thead><tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${dataArr.map(row => `<tr>${columns.map(c => `<td>${escapeHtml(row[c] || row[c.replace(' ', '_')] || '-')}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${columns.length}">No data</td></tr>`}</tbody></table></div></div>`;
  }

  async function loadCurrentSection() {
    await loadEmployeesFromSheet();
    if (currentSection === 'dashboard') await renderDashboard();
    else if (currentSection === 'tickets') await renderTicketsPage();
    else if (currentSection === 'employees') await renderEmployeesPage();
    else if (currentSection === 'departments') await renderDepartments();
    else if (currentSection === 'kpis') await renderKPIs();
    else if (currentSection === 'bsc') await renderBSC();
    else await renderDashboard();
    document.querySelectorAll('.nav-link').forEach(link => { link.classList.remove('active'); if (link.getAttribute('data-section') === currentSection) link.classList.add('active'); });
    window.taskFilter = null;
  }

  document.querySelectorAll('.nav-link').forEach(link => { link.addEventListener('click', () => { currentSection = link.getAttribute('data-section'); loadCurrentSection(); }); });
  loadCurrentSection();
</script>
</body>
</html>
